# Ingest VM 103 only. Never merge onto media-apps. docker-compose 1.29, file format 2.4.
# Writers: /mnt/downloads must already be an NFS mount. Check it, then decide.
#   ../scripts/require-nfs-mount.sh /mnt/downloads
# If that command exits non-zero, do not start containers. The script itself does not start them.
# root_squash maps UID 0 to the anonymous user. It does not map UID 1000 to nobody.
# /mnt/downloads must be owned or ACL'd for 1000:1000. Prove the write with
# scripts/prove-ingest-write.sh as that user, without sudo.
# No library mount. No stream-cache mount. No Docker socket. No host network.
# No Proxmox or management credentials in this file.

version: "2.4"

services:
  qbittorrent:
    # linuxserver s6 must start as root, then drops to PUID:PGID. Do not set user.
    image: lscr.io/linuxserver/qbittorrent:5.0.1
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      WEBUI_PORT: "8080"
    volumes:
      - /mnt/downloads:/downloads
      - qbit-config:/config
    ports:
      - "127.0.0.1:8080:8080"
    networks: [ingest]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.00
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  libtorrent-engine:
    image: el-torrento-engine:local
    build:
      context: ../../el-torrento/engine
      dockerfile: Dockerfile
    user: "1000:1000"
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN}
    volumes:
      - /mnt/downloads:/downloads
    ports:
      - "192.168.4.53:8741:8741"
    networks: [ingest]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8741),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  qbit-config: {}

networks:
  ingest:
    driver: bridge
