# Not applied. Digests must replace PIN_BEFORE_USE before any pull.
# Target: VM 102 on pve3040a. Never the ingest VM.

services:
  postgres:
    image: postgres@sha256:PIN_BEFORE_USE
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: eltorrento
      POSTGRES_DB: eltorrento
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [apps]
    restart: unless-stopped

  api:
    image: ghcr.io/hasnain-niazi/el-torrento-api@sha256:PIN_BEFORE_USE
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
    networks: [apps, mgmt]
    restart: unless-stopped

  watch:
    image: ghcr.io/hasnain-niazi/el-torrento-watch@sha256:PIN_BEFORE_USE
    networks: [apps]
    restart: unless-stopped

  caddy:
    image: caddy@sha256:PIN_BEFORE_USE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [apps]
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr@sha256:PIN_BEFORE_USE
    networks: [apps]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:PIN_BEFORE_USE
    networks: [apps]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:PIN_BEFORE_USE
    networks: [apps]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:PIN_BEFORE_USE
    networks: [apps]
    restart: unless-stopped

  mgmt-worker:
    image: ghcr.io/hasnain-niazi/el-torrento-mgmt@sha256:PIN_BEFORE_USE
    environment:
      PVE_MUTATION_TOKEN_ID: ${PVE_MUTATION_TOKEN_ID}
      PVE_MUTATION_TOKEN_SECRET: ${PVE_MUTATION_TOKEN_SECRET}
    networks: [mgmt]
    # no ports published
    restart: unless-stopped

volumes:
  pgdata: {}

networks:
  apps: {}
  mgmt:
    internal: true
