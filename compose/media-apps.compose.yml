# Apps VM 102. SQLite on app-data volume (api service only). docker-compose 1.29 compatible.
# Custom images: scripts/publish-images.sh. Pin tags in image-pins.env when digests exist.

services:
  api:
    image: el-torrento-web:local
    build:
      context: ../../el-torrento
      dockerfile: Dockerfile
    environment:
      ELTORRENTO_ROLE: admin
      ELTORRENTO_DB: /app/data/app.sqlite
      ENGINE_URL: http://192.168.4.53:8741
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      MEDIA_WORKER_URL: http://192.168.4.50:8088
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      JELLYFIN_URL: http://192.168.4.50:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: ${SEERR_API_KEY}
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      MGMT_WORKER_URL: http://mgmt-worker:9090
      PIECE_WAIT_MS: "8000"
    volumes:
      - app-data:/app/data
    networks: [apps, mgmt]
    restart: unless-stopped

  watch:
    image: el-torrento-web:local
    environment:
      ELTORRENTO_ROLE: watch
      INTERNAL_API_URL: http://api:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    depends_on: [api]
    networks: [apps]
    restart: unless-stopped

  mgmt-worker:
    image: el-torrento-mgmt-worker:local
    build:
      context: ../mgmt-worker
      dockerfile: Dockerfile
    environment:
      PVE_MUTATION_TOKEN: ${PVE_MUTATION_TOKEN}
      PVE_HOSTS: ${PVE_HOSTS:-192.168.4.20,192.168.4.109,192.168.4.33}
    networks: [mgmt]
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, watch]
    networks: [apps]
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.0.0
    volumes:
      - seerr-config:/app/config
    networks: [apps]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.9
    volumes:
      - sonarr-config:/config
    networks: [apps]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:5.10.4
    volumes:
      - radarr-config:/config
    networks: [apps]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.25.3
    volumes:
      - prowlarr-config:/config
    networks: [apps]
    restart: unless-stopped

volumes:
  app-data: {}
  caddy-data: {}
  caddy-config: {}
  seerr-config: {}
  sonarr-config: {}
  radarr-config: {}
  prowlarr-config: {}

networks:
  apps: {}
  mgmt: {}
