# Apps VM 102 (192.168.4.52). docker-compose 1.29, file format 2.4.
# mem_limit and cpus apply on `docker-compose up` (swarm deploy.resources do not).
# Limits are ceilings for this file, not a measurement of the guest.
# SQLite is mounted only by api. Watch, Caddy, and *arr do not get the database file.
# mgmt-worker has no host port, no Docker socket, and no Proxmox publish.
# TLS to Proxmox uses the image trust store. Do not set NODE_TLS_REJECT_UNAUTHORIZED=0.
# The web image CMD is `npm start` (`next start -p 3847`). Caddy targets that port.

version: "2.4"

services:
  api:
    image: el-torrento-web:local
    build:
      context: ../../el-torrento
      dockerfile: Dockerfile
    user: "node"
    environment:
      ELTORRENTO_ROLE: admin
      ELTORRENTO_DB: /app/data/app.sqlite
      ENGINE_URL: http://192.168.4.53:8741
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      MEDIA_WORKER_URL: http://192.168.4.50:8088
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      JELLYFIN_URL: http://192.168.4.50:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: ${SEERR_API_KEY}
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      MGMT_WORKER_URL: http://mgmt-worker:9090
      PIECE_WAIT_MS: "8000"
    volumes:
      - app-data:/app/data
    networks: [apps, mgmt]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.00
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/api/auth').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  watch:
    image: el-torrento-web:local
    user: "node"
    environment:
      ELTORRENTO_ROLE: watch
      INTERNAL_API_URL: http://api:3847
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks: [apps]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3847,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  mgmt-worker:
    image: el-torrento-mgmt-worker:local
    build:
      context: ../mgmt-worker
      dockerfile: Dockerfile
    user: "node"
    environment:
      PVE_MUTATION_TOKEN: ${PVE_MUTATION_TOKEN}
      PVE_HOSTS: ${PVE_HOSTS:-192.168.4.20,192.168.4.109,192.168.4.33}
    networks: [mgmt]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    user: "1000:1000"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      watch:
        condition: service_healthy
    networks: [apps]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      # This image has no curl or wget. validate checks the Caddyfile the process loads.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.0.0
    user: "node"
    volumes:
      - seerr-config:/app/config
    networks: [apps]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5055/api/v1/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  sonarr:
    # linuxserver s6 must start as root, then drops to PUID:PGID. Do not set user.
    image: lscr.io/linuxserver/sonarr:4.0.9
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - sonarr-config:/config
    networks: [apps]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  radarr:
    # linuxserver s6 must start as root, then drops to PUID:PGID. Do not set user.
    image: lscr.io/linuxserver/radarr:5.10.4
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - radarr-config:/config
    networks: [apps]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  prowlarr:
    # linuxserver s6 must start as root, then drops to PUID:PGID. Do not set user.
    image: lscr.io/linuxserver/prowlarr:1.25.3
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - prowlarr-config:/config
    networks: [apps]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  app-data: {}
  caddy-data: {}
  caddy-config: {}
  seerr-config: {}
  sonarr-config: {}
  radarr-config: {}
  prowlarr-config: {}

networks:
  apps:
    driver: bridge
  mgmt:
    driver: bridge
