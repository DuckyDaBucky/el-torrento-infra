# Playback VM 100, 192.168.4.50. docker-compose 1.29, file format 2.4.
# Do not rebuild that guest to apply this file. Do not start containers from this repo.
# Library is read-only NFS. Before any start, confirm the mount and stop if it fails:
#   ../scripts/require-nfs-mount.sh /mnt/library
# A missing path must not become an empty directory on the VM disk.
# Transcode temp stays on a local volume. No Docker socket. No host network.
# iGPU devices are omitted until a benchmark says the device exists.

version: "2.4"

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    user: "1000:1000"
    volumes:
      - /mnt/library:/media:ro
      - jellyfin-config:/config
      - transcode-temp:/cache
    ports:
      - "192.168.4.50:8096:8096"
    networks: [playback]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.50
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  media-worker:
    image: el-torrento-media-worker:local
    build:
      context: ../../el-torrento/media-worker
      dockerfile: Dockerfile
    user: "node"
    environment:
      ENGINE_URL: http://192.168.4.53:8741
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      PIECE_WAIT_MS: "8000"
      HLS_CACHE: /cache/hls
    volumes:
      - hls-cache:/cache/hls
    ports:
      - "192.168.4.50:8088:8080"
    networks: [playback]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.00
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  jellyfin-config: {}
  transcode-temp: {}
  hls-cache: {}

networks:
  playback:
    driver: bridge
