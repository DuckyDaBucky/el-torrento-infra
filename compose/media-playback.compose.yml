# Playback VM 100. Do not rebuild that guest to apply this file.
# Jellyfin config and transcode temp stay on the VM disk. Library is read-only NFS.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    volumes:
      - /mnt/library:/media:ro
      - jellyfin-config:/config
      - transcode-temp:/cache
    ports:
      - "8096:8096"
    restart: unless-stopped

volumes:
  jellyfin-config: {}
  transcode-temp: {}

# iGPU devices are omitted until a benchmark says the device exists.
# Do not add /dev/dri here by default.
# Progressive HLS for El Torrento runs in the apps web image, not here.
